<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapHunt - Home</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav-bar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">&#x1F3AF;</span>
        <span class="logo-text">SnapHunt</span>
      </a>
      <div class="nav-links desktop-nav">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="capture.html" class="nav-link">Capture</a>
        <a href="inventory.html" class="nav-link">Inventory</a>
        <button id="signOutBtn" class="btn btn-ghost btn-sm">Sign Out</button>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
    <div class="mobile-nav" id="mobileNav">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="capture.html" class="nav-link">Capture</a>
      <a href="inventory.html" class="nav-link">Inventory</a>
      <button id="mobileSignOutBtn" class="btn btn-ghost btn-sm">Sign Out</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Hero / Welcome Section -->
    <section class="hero-section fade-in">
      <h1 class="hero-title">Welcome back<span id="userGreeting"></span></h1>
      <p class="hero-subtitle">Capture and catalog your equipment with AI-powered recognition</p>
      <a href="capture.html" class="btn btn-primary btn-lg pulse-glow">
        <span class="btn-icon">&#x1F4F7;</span>
        Start Capture
      </a>
    </section>

    <!-- Stats Row -->
    <section class="stats-row fade-in">
      <div class="stat-card">
        <span class="stat-number" id="statTotal">0</span>
        <span class="stat-label">Total Items</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="statToday">0</span>
        <span class="stat-label">Captured Today</span>
      </div>
    </section>

    <!-- Recent Captures -->
    <section class="recent-section fade-in">
      <h2 class="section-title">Recent Captures</h2>
      <div id="recentList" class="recent-list">
        <!-- Skeleton loaders -->
        <div class="skeleton-card skeleton">
          <div class="skeleton-img"></div>
          <div class="skeleton-text"></div>
          <div class="skeleton-text short"></div>
        </div>
        <div class="skeleton-card skeleton">
          <div class="skeleton-img"></div>
          <div class="skeleton-text"></div>
          <div class="skeleton-text short"></div>
        </div>
        <div class="skeleton-card skeleton">
          <div class="skeleton-img"></div>
          <div class="skeleton-text"></div>
          <div class="skeleton-text short"></div>
        </div>
      </div>
      <div id="emptyState" class="empty-state" hidden>
        <span class="empty-icon">&#x1F4E6;</span>
        <p>No captures yet. Start by capturing your first item!</p>
        <a href="capture.html" class="btn btn-primary">Capture Now</a>
      </div>
    </section>
  </main>

  <script src="assets/js/home.js" type="module"></script>
</body>
</html>
